<!DOCTYPE html>
<html id="background" lang="en">
    <head>
        <link rel="stylesheet" href="main-stylesheet.css">
        <title>Login/Register</title>
    </head>

    <header class="pageHeader">
        <a href="index.html"><button id="signOut">Go Back</button></a>
        <h1 id="bookedLogo">booked</h1>
    </header>

    <body class="registrationBody">
        <div class="registrationContainer">
            <form id="registrationForm">
                <label for="username">Username:</label>
                <input type="text" id="usernameField" name="username" placeholder="username">
                <span class="error" id="usernameError"></span><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="email">
                <span class="error" id="emailError"></span><br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="password">
                <span class="error" id="passwordError"></span><br><br>

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="confirm password">
                <span class="error" id="confirmError"></span><br><br>
            </form>
            
        </div>
        <button id="buttonStyle" type="button" onclick="validateForm()">Register</button>
        <script>
            function validateForm() {
                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let password = document.getElementById("password").value;
                let confirmPassword = document.getElementById("confirmPassword").value;
        
                let nameError = document.getElementById("nameError");
                let emailError = document.getElementById("emailError");
                let passwordError = documnet.getElementById("passwordError");
                let confirmError = document.getElementById("confirmError");
                
                // clear the previous errors
                nameError.textContent = "";
                emailError.textContent = "";
                confirmError.textContent = "";
                
                let valid = true;

                // checks if the username field is empty
                if (name === "") {
                    nameError.textContent = "Name is required.";
                    valid = false;
                }

                // checks if email field is empty
                if (email === "") {
                    emailError.textContent = "Email is required.";
                    valid = false;
                // checks if the email is in a valid format
                } else if (!validateEmail(email)) {
                    emailError.textContent = "Invalid email address.";
                    valid = false;
                }
                
                // checks if the password field is empty
                if (password === "") {
                    passwordError.textContent("Password is required!");
                    valid = false;
                // checks if the confirm password field is empty
                } else if (confirmPassword === "") {
                    confirmError.textContent("Password confirmation is required!");
                    valid = false;
                // checks if the password matches the password confirmation
                } else if (password !== confirmPassword) {
                    confirmError.textContent = "The passwords do not match!"
                    valid = false;
                }

                if (valid) {
                    document.getElementById("registrationForm").submit();
                }
            }

            function validateEmail(email) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                return emailPattern.test(email);
            }
        </script>
    </body>
</html>
