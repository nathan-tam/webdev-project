<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="registrationStyles.css">
        <title>Login/Register</title>
    </head>
    <body>
        <header>
            <h1>Tam Industries</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="aboutme.html">Our Team</a>
                <a href="products.html">Products</a>
            </nav>
        </header>
        <div class="registration">
            <form id="registrationForm">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
                <span class="error" id="nameError"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <span class="error" id="emailError"></span>

                <label for="address">Mailing Address:</label>
                <input type="text" id="address" name="address">
                <span class="error" id="addressError"></span>

                
                <label>How did you hear about us?</label>
                <label><input type="radio" name="referral" value="social">Social Media</label>
                <label><input type="radio" name="referral" value="ads">Advertising</label>
                <label><input type="radio" name="referral" value="word">Word of Mouth</label>
                <label><input type="radio" name="referral" value="search">Internet Search</label>
                <label><input type="radio" name="referral" value="other" id="otherReferral">Other</label>
                <input type="text" id="otherText" name="otherText" placeholder="Please specify" style="display: none;">
                <span class="error" id="referralError"></span>
                
                <button type="button" onclick="validateForm()">Register</button>
            </form>
        </div>
        <script>
            function validateForm() {
                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let address = document.getElementById("address").value;
                let referralType = null;
                let referralOptions = document.getElementsByName("referral");
                let otherReferral = document.getElementById("otherText").value;

                for (let i = 0; i < referralOptions.length; i++) {
                    if (referralOptions[i].checked) {
                        referralType = referralOptions[i];
                        break;
                    }
                }

                let nameError = document.getElementById("nameError");
                let emailError = document.getElementById("emailError");
                let addressError = document.getElementById("addressError");
                let referralError = document.getElementById("referralError");

                // clear previous errors
                nameError.textContent = "";
                emailError.textContent = "";
                addressError.textContent = "";
                referralError.textContent = "";

                let valid = true;

                if (name === "") {
                    nameError.textContent = "Name is required.";
                    valid = false;
                }

                if (email === "") {
                    emailError.textContent = "Email is required.";
                    valid = false;
                } else if (!validateEmail(email)) {
                    emailError.textContent = "Invalid email address.";
                    valid = false;
                }

                if (address === "") {
                    addressError.textContent = "Address is required.";
                    valid = false;
                } else if (!validateAddress(address)) {
                    addressError.textContent = "Invalid postal code.";
                    valid = false;
                }

                if (!referralType) {
                    referralError.textContent = "Referral method is required.";
                    valid = false;
                } else if (referralType.value == "other" && otherReferral === "") {
                    referralError.textContent = "Please specify your referral method.";
                    valid = false;
                }

                if (valid) {
                    document.getElementById("registrationForm").submit();
                }
            }

            function validateEmail(email) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                return emailPattern.test(email);
            }

            function validateAddress(address) {
                const postalPattern = /^[A-Za-z]\d[A-Za-z] \d[A-Za-z]\d$/;

                return postalPattern.test(address);
            }
        </script>
    </body>
</html>
